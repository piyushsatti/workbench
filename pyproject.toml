# Script and test tooling for the workbench repo. Not published as a package.
# Run repo scripts and tests with: uv run python … (see README).
# Exception: setup/workstation/scripts/profile.py stays stdlib-only and is invoked
# as bare python3 from bootstrap.sh before any uv environment exists.

[project]
name = "workbench"
version = "0.0.0"
description = "Machine setup, dotfiles, and marketplace tooling for the workbench repository"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["ruff>=0.8,<0.17"]

[tool.uv]
package = false
